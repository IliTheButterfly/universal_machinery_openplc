name: tests

# Per project policy CI only runs against the integration branches:
# every PR merging *into* main or dev gets exercised; in-flight feature
# branches don't burn CI minutes per push.
on:
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      # The backend dispatches to ``universal_machinery``'s emitters
      # / parsers, so we clone the parent project alongside and
      # install it first.  Tracking the parent's ``dev`` branch
      # matches the project's integration policy: submodule PRs go
      # against parent dev, and dev is where the latest emitter
      # fixes (matiec round-trip, AT-clause direct rep, etc.) land.
      - name: Checkout universal_machinery (parent)
        uses: actions/checkout@v4
        with:
          repository: IliTheButterfly/universal_machinery
          ref: dev
          path: universal_machinery

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install parent + backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./universal_machinery[dev]
          pip install -e ./backend[dev]

      - name: Run pytest
        # API-shape smoke tests + real round-trip tests (write+read
        # via the universal_machinery emitters/parsers).
        run: cd backend && pytest tests/ -q
