[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openplc_backend"
version = "0.0.1"
description = "Emit PLCopen XML / Structured Text for the OpenPLC runtime"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "iliana" },
]
keywords = ["plc", "openplc", "iec-61131-3", "structured-text", "plcopen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
# ``universal_machinery`` is the parent vendor-neutral IL project that
# owns the emitters / parsers this backend dispatches to.  Not on PyPI
# yet; consume via the parent repo's submodule layout, or pip-install
# from the parent's git URL alongside this package.
dependencies = [
    "universal_machinery",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openplc_backend*"]
